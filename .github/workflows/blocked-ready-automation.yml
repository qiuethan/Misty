name: blocked-ready-automation

# Keeps issue blocker state in sync automatically.
#
# Declare blockers in an issue body with a line like:
#   Blocked by: #40, #42
# (case-insensitive, anywhere in the body). The `blocked` label marks issues
# that still have an open blocker; `ready` marks issues whose blockers are all
# resolved.
#
# - When a blocker issue is CLOSED: every issue it blocks whose blockers are now
#   ALL closed gets `blocked` removed + `ready` added.
# - When a blocker issue is REOPENED: the issues it blocks get re-blocked
#   (`ready` removed + `blocked` added).
#
# Board Status (optional): if a Projects-scoped PAT is stored as the
# PROJECTS_TOKEN repo secret, the dependent issue's project Status is also set to
# Ready / Backlog. Without that secret only labels change — the board step
# no-ops and the run still succeeds (same "unset secret = skip" pattern as
# discord-pr-notify.yml).
#
# See issue #33 (LLM service epic) — the first set of blocker/blocked issues.

on:
  issues:
    types: [closed, reopened]

permissions:
  issues: write

jobs:
  sync-blockers:
    runs-on: ubuntu-latest
    steps:
      - name: Sync dependent issues
        uses: actions/github-script@v7
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          script: |
            // --- Project board config (stable IDs for the "Misty" project #2) ---
            const PROJECT_ID   = 'PVT_kwHOBKcJlc4BcaH-';
            const STATUS_FIELD = 'PVTSSF_lAHOBKcJlc4BcaH-zhXDMKo';
            const OPT_READY    = '08afe404';
            const OPT_BACKLOG  = 'f75ad846';

            const { owner, repo } = context.repo;
            const changed = context.payload.issue.number;
            const action  = context.payload.action; // 'closed' | 'reopened'
            const token   = process.env.PROJECTS_TOKEN;

            // Parse a "Blocked by: #1, #2" line into blocker numbers.
            const blockersOf = (body) => {
              const line = (body || '').match(/^.*blocked by:.*$/im);
              if (!line) return [];
              return [...line[0].matchAll(/#(\d+)/g)].map((m) => Number(m[1]));
            };

            // Cache issue state lookups (blockers may be closed, so not in the open list).
            const stateCache = new Map();
            const stateOf = async (n) => {
              if (!stateCache.has(n)) {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: n });
                stateCache.set(n, data.state);
              }
              return stateCache.get(n);
            };

            // Optional: set the issue's project Status via the PAT (skipped if unset).
            const gqlPAT = async (query, variables) => {
              const res = await fetch('https://api.github.com/graphql', {
                method: 'POST',
                headers: { Authorization: `bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables }),
              });
              const json = await res.json();
              if (json.errors) throw new Error(JSON.stringify(json.errors));
              return json.data;
            };
            const setBoardStatus = async (issueNumber, optionId) => {
              if (!token) return;
              try {
                const data = await gqlPAT(
                  `query($owner:String!,$repo:String!,$number:Int!){
                     repository(owner:$owner,name:$repo){ issue(number:$number){
                       projectItems(first:20){ nodes{ id project{ id } } } } } }`,
                  { owner, repo, number: issueNumber },
                );
                const item = data.repository.issue.projectItems.nodes
                  .find((n) => n.project.id === PROJECT_ID);
                if (!item) { core.info(`#${issueNumber}: not on the project board — skipping Status.`); return; }
                await gqlPAT(
                  `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
                     updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,
                       value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }`,
                  { p: PROJECT_ID, i: item.id, f: STATUS_FIELD, o: optionId },
                );
                core.info(`#${issueNumber}: board Status updated.`);
              } catch (e) {
                core.warning(`#${issueNumber}: board Status update failed: ${e.message}`);
              }
            };

            const setLabels = async (issueNumber, add, remove) => {
              try { await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [add] }); }
              catch (e) { core.warning(`#${issueNumber}: add '${add}' failed: ${e.message}`); }
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: remove }); }
              catch (e) { if (e.status !== 404) core.warning(`#${issueNumber}: remove '${remove}' failed: ${e.message}`); }
            };

            if (!token) core.info('PROJECTS_TOKEN not set — updating labels only (board Status skipped).');

            // Find open issues that declare the changed issue as a blocker.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const dependents = open.filter((i) => !i.pull_request && blockersOf(i.body).includes(changed));
            if (dependents.length === 0) {
              core.info(`No open issues are blocked by #${changed}.`);
              return;
            }

            for (const dep of dependents) {
              if (action === 'reopened') {
                // A blocker reopened → this issue is blocked again.
                await setLabels(dep.number, 'blocked', 'ready');
                await setBoardStatus(dep.number, OPT_BACKLOG);
                core.info(`#${dep.number}: re-blocked (blocker #${changed} reopened).`);
                continue;
              }
              // action === 'closed': ready only if ALL blockers are closed.
              const blockers = blockersOf(dep.body);
              const states = await Promise.all(blockers.map(stateOf));
              const outstanding = blockers.filter((_, idx) => states[idx] !== 'closed');
              if (outstanding.length === 0) {
                await setLabels(dep.number, 'ready', 'blocked');
                await setBoardStatus(dep.number, OPT_READY);
                core.info(`#${dep.number}: all blockers resolved → ready.`);
              } else {
                core.info(`#${dep.number}: still blocked by ${outstanding.map((n) => '#' + n).join(', ')}.`);
              }
            }
