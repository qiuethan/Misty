<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>UTMIST bot playground</title>
  <style>
    body { font-family: system-ui; max-width: 720px; margin: 1em auto; padding: 0 1em; }
    .banner { background: #7f1d1d; color: white; padding: 0.5em 1em; border-radius: 4px; margin-bottom: 1em; }
    details { border: 1px solid #ccc; padding: 0.75em; margin-bottom: 0.5em; border-radius: 4px; }
    summary { cursor: pointer; font-weight: 600; }
    form label { display: block; margin: 0.5em 0 0.25em; }
    form input, form select { width: 100%; box-sizing: border-box; padding: 0.35em; }
    form button { margin-top: 0.75em; padding: 0.4em 1em; }
    .result { margin-top: 0.5em; padding: 0.5em; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
    .embed { border-left: 3px solid #5865f2; padding-left: 0.5em; margin-top: 0.35em; }
    .embed h4 { margin: 0; }
    .embed .field { margin-top: 0.3em; }
    .embed .field .name { font-weight: 600; font-size: 0.85em; }
    input#actingAs { width: 260px; }
  </style>
</head>
<body>
  <div class="banner">🔴 Spoof mode — DEV ONLY. All requests act as the "Acting as" Discord ID below.</div>
  <label>Acting as (Discord ID): <input id="actingAs" placeholder="123456789012345678" /></label>
  <div id="commands"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
