[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_auth"]

[project]
name = "platform-auth"
version = "0.1.0"
description = "Shared API-key auth (keys, scopes, audit) for UTMIST platform services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.38",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
