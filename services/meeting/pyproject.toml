[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[project]
name = "meeting"
version = "0.1.0"
description = "UTMIST meeting recording + transcription service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
    "amazon-transcribe>=0.6",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "platform-auth",
    "av>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv.sources]
platform-auth = { workspace = true }

[project.scripts]
meeting-keys = "src.mint_key:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
