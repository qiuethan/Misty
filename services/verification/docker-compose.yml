services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: verification
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: verification
    ports:
      - "5434:5432"
    volumes:
      - verification_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verification"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  verification_pg:
